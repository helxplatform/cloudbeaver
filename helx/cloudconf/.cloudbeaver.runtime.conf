{
    "server": {
        "serverPort": 8978,
        "serverName": "CloudBeaver Azure",
        "serverHost": "0.0.0.0",
        "workspaceLocation": "workspace",
        "contentRoot": "web",
        "driversLocation": "drivers",
        "expireSessionAfterPeriod": 600000,
        "rootURI": "${CLOUDBEAVER_ROOT_URI:/}",
        "serviceURI": "${CLOUDBEAVER_ROOT_URI:/api/}/api/",
        "sm": {
            "enableBruteForceProtection": "${CLOUDBEAVER_BRUTE_FORCE_PROTECTION_ENABLED:true}",
            "expiredAuthAttemptInfoTtl": 60,
            "maxFailedLogin": "${CLOUDBEAVER_MAX_FAILED_LOGINS:10}",
            "minimumLoginTimeout": "${CLOUDBEAVER_MINIMUM_LOGIN_TIMEOUT:1}",
            "blockLoginPeriod": "${CLOUDBEAVER_BLOCK_PERIOD:300}",
            "passwordPolicy": {
                "minLength": "${CLOUDBEAVER_POLICY_MIN_LENGTH:8}",
                "requireMixedCase": "${CLOUDBEAVER_POLICY_REQUIRE_MIXED_CASE:true}",
                "minNumberCount": "${CLOUDBEAVER_POLICY_MIN_NUMBER_COUNT:1}",
                "minSymbolCount": "${CLOUDBEAVER_POLICY_MIN_SYMBOL_COUNT:0}"
            }
        }
    },
    "app": {
        "anonymousAccessAllowed": true,
        "anonymousUserTeam": "user",
        "defaultUserTeam": "user",
        "supportsCustomConnections": false,
        "publicCredentialsSaveEnabled": true,
        "adminCredentialsSaveEnabled": true,
        "resourceManagerEnabled": true,
        "systemVariablesResolvingEnabled": "${CLOUDBEAVER_SYSTEM_VARIABLES_RESOLVING_ENABLED:false}",
        "resourceQuotas": {
            "dataExportFileSizeLimit": 10000000,
            "resourceManagerFileSizeLimit": 500000,
            "sqlMaxRunningQueries": 100,
            "sqlResultSetRowsLimit": 100000,
            "sqlResultSetMemoryLimit": 2000000,
            "sqlTextPreviewMaxLength": 4096,
            "sqlBinaryPreviewMaxLength": 261120
        },
        "defaultNavigatorSettings": {
            "showSystemObjects": true,
            "showUtilityObjects": false,
            "showOnlyEntities": false,
            "mergeEntities": false,
            "hideFolders": false,
            "hideSchemas": false
        },
        "forwardProxy": false,
        "defaultAuthProvider": "reverseProxy",
        "enabledAuthProviders": [
            "reverseProxy"
        ],
        "authConfigurations": [
            {
                "id": "reverseProxy",
                "provider": "reverseProxy",
                "displayName": "Reverse Proxy",
                "disabled": false,
                "iconURL": "",
                "description": "",
                "parameters": {
                    "full-name-header": "REMOTE_USER"
                }
            }
        ]
    }
}


// https://dbeaver.com/docs/cloudbeaver/Server-configuration/
// https://github.com/dbeaver/cloudbeaver/wiki/Server-configuration#automatic-server-configuration
// https://github.com/dbeaver/cloudbeaver/wiki/Reverse-proxy-header-authentication/d7071b6f790512b509de76824d39ff1a6798e949
